<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventEase Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="dashboard-layout">
    <!-- Header -->
    <header class="main-header">
      <h2 class="logo">EventEase</h2>
      <nav class="event-nav">
        <button class="nav-btn" onclick="showEvent('wedding')">Wedding</button>
        <button class="nav-btn" onclick="showEvent('birthday')">Birthday</button>
        <button class="nav-btn" onclick="showEvent('engagement')">Engagement</button>
      </nav>
    </header>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <h3 class="content-title">Dashboard</h3>
      <p class="call-to-action">Select an event type above to manage details.</p>
    </main>

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="profile-card">
        <h3>User Profile</h3>
        <p class="username-display" id="username"></p>
        <button class="logout-btn" onclick="logout()">Logout</button>

        <!-- Saved Events List -->
        <div class="saved-section">
          <h4>Saved Events</h4>
          <ul id="saved-list"></ul>
        </div>
      </div>
    </aside>
  </div>

  <script>
    // Display username
    document.getElementById("username").textContent = localStorage.getItem("user") || "Guest User";

    // Logout
    function logout() {
      localStorage.removeItem("user");
      window.location.href = "index.html";
    }

    // Show Event Form
    function showEvent(type, existing = null) {
      let data = existing || {};
      let html = `
        <h3 class="content-title">${capitalize(type)} Management</h3>
        <form class="event-form" onsubmit="saveEvent(event, '${type}')">
      `;

      if (type === "wedding") {
        html += `
          <input id="groom" value="${data.groom || ""}" placeholder="Groom Name">
          <input id="bride" value="${data.bride || ""}" placeholder="Bride Name">
          <input id="time" type="time" value="${data.time || ""}">
          <input id="venue" value="${data.venue || ""}" placeholder="Venue">
          <select id="food">
            <option ${data.food === "Veg" ? "selected" : ""}>Veg</option>
            <option ${data.food === "Non-Veg" ? "selected" : ""}>Non-Veg</option>
            <option ${data.food === "Mixed" ? "selected" : ""}>Mixed</option>
          </select>
          <textarea id="details" rows="3" placeholder="Event Details">${data.details || ""}</textarea>
        `;
      } else {
        // Generic form for other events
        html += `
          <input id="name" value="${data.name || ""}" placeholder="Name">
          <input id="date" type="date" value="${data.date || ""}">
          <input id="time" type="time" value="${data.time || ""}">
          <input id="venue" value="${data.venue || ""}" placeholder="Venue">
          <textarea id="details" rows="3" placeholder="Event Details">${data.details || ""}</textarea>
        `;
      }

      html += `<button class="save-btn" type="submit">Save ${capitalize(type)} Details</button></form>`;
      document.getElementById("main-content").innerHTML = html;
    }

    // Save Event to localStorage
    function saveEvent(e, type) {
      e.preventDefault();

      let events = JSON.parse(localStorage.getItem("events")) || [];

      let data =
        type === "wedding"
          ? {
              type,
              groom: document.getElementById("groom").value,
              bride: document.getElementById("bride").value,
              time: document.getElementById("time").value,
              venue: document.getElementById("venue").value,
              food: document.getElementById("food").value,
              details: document.getElementById("details").value,
            }
          : {
              type,
              name: document.getElementById("name").value,
              date: document.getElementById("date").value,
              time: document.getElementById("time").value,
              venue: document.getElementById("venue").value,
              details: document.getElementById("details").value,
            };

      // Check if event exists → update instead of add
      const existingIndex = events.findIndex((ev) => ev.type === type);
      if (existingIndex >= 0) events[existingIndex] = data;
      else events.push(data);

      localStorage.setItem("events", JSON.stringify(events));
      loadSavedEvents();
      alert(`${capitalize(type)} details saved successfully!`);
    }

    // Load Saved Events in Sidebar
    function loadSavedEvents() {
      const events = JSON.parse(localStorage.getItem("events")) || [];
      const list = document.getElementById("saved-list");
      list.innerHTML = "";

      if (events.length === 0) {
        list.innerHTML = "<li>No events yet</li>";
        return;
      }

      events.forEach((ev, index) => {
        const li = document.createElement("li");
        li.textContent = capitalize(ev.type);
        li.style.cursor = "pointer";
        li.onclick = () => showEvent(ev.type, ev);
        list.appendChild(li);
      });
    }

    // Helper
    function capitalize(text) {
      return text.charAt(0).toUpperCase() + text.slice(1);
    }

    // Initial load
    loadSavedEvents();
  </script>
</body>
</html>
